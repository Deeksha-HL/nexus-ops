services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexus_ops
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql://nexus:nexus@db:5432/nexus_ops
      JWT_SECRET: change-me-in-production
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173
    ports: ["4000:4000"]
    depends_on: [db]
volumes:
  postgres_data:
